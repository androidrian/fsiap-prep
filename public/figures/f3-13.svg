<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="520" height="260" role="img" aria-labelledby="t d">
  <title id="t">Ficha 3, exercício 13</title>
  <desc id="d">Campo magnético B a entrar na página (cruzes). Anteparo horizontal em baixo com o ponto P à esquerda e o ponto A 2,5 cm à direita. A partícula sai de A com velocidade v para cima. Eixos: x para a direita, y para cima, origem 0.</desc>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1f2933"/>
    </marker>
    <marker id="tipSmall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1f2933"/>
    </marker>
    <g id="x">
      <path d="M-5 -5 L5 5 M-5 5 L5 -5" stroke="#1f2933" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    </g>
  </defs>

  <rect x="0" y="0" width="520" height="260" fill="#ffffff"/>
  <rect x="8" y="8" width="504" height="244" fill="none" stroke="#1f2933" stroke-width="1"/>

  <!-- campo B a entrar na página -->
  <g>
    <use href="#x" x="40" y="30"/><use href="#x" x="85" y="30"/><use href="#x" x="130" y="30"/><use href="#x" x="175" y="30"/><use href="#x" x="220" y="30"/><use href="#x" x="265" y="30"/><use href="#x" x="310" y="30"/><use href="#x" x="355" y="30"/>
    <use href="#x" x="40" y="65"/><use href="#x" x="85" y="65"/><use href="#x" x="130" y="65"/><use href="#x" x="175" y="65"/><use href="#x" x="220" y="65"/><use href="#x" x="265" y="65"/><use href="#x" x="310" y="65"/><use href="#x" x="355" y="65"/>
    <use href="#x" x="40" y="100"/><use href="#x" x="85" y="100"/><use href="#x" x="130" y="100"/><use href="#x" x="175" y="100"/><use href="#x" x="220" y="100"/><use href="#x" x="265" y="100"/><use href="#x" x="310" y="100"/><use href="#x" x="355" y="100"/>
    <use href="#x" x="40" y="135"/><use href="#x" x="85" y="135"/><use href="#x" x="130" y="135"/><use href="#x" x="175" y="135"/><use href="#x" x="220" y="135"/><use href="#x" x="265" y="135"/><use href="#x" x="310" y="135"/><use href="#x" x="355" y="135"/>
    <use href="#x" x="40" y="170"/><use href="#x" x="85" y="170"/><use href="#x" x="130" y="170"/><use href="#x" x="175" y="170"/><use href="#x" x="220" y="170"/><use href="#x" x="265" y="170"/><use href="#x" x="310" y="170"/><use href="#x" x="355" y="170"/>
  </g>

  <!-- rótulo B com seta de vetor -->
  <text x="372" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic" fill="#1f2933">B</text>
  <line x1="372" y1="54" x2="385" y2="54" stroke="#1f2933" stroke-width="1.2" marker-end="url(#tipSmall)"/>

  <!-- anteparo com fenda em A -->
  <line x1="25" y1="195" x2="232" y2="195" stroke="#1f2933" stroke-width="2.5"/>
  <line x1="253" y1="195" x2="385" y2="195" stroke="#1f2933" stroke-width="2.5"/>

  <!-- ponto P -->
  <circle cx="130" cy="195" r="5.5" fill="#1f2933"/>
  <text x="106" y="189" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#1f2933">P</text>

  <!-- ponto A e velocidade -->
  <circle cx="242.5" cy="195" r="3.5" fill="#1f2933"/>
  <text x="225" y="189" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#1f2933">A</text>
  <line x1="242.5" y1="190" x2="242.5" y2="146" stroke="#1f2933" stroke-width="2.2" marker-end="url(#tip)"/>
  <text x="253" y="162" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" fill="#1f2933">v</text>
  <line x1="252" y1="148" x2="263" y2="148" stroke="#1f2933" stroke-width="1.2" marker-end="url(#tipSmall)"/>

  <!-- cota 2,5 cm entre P e A -->
  <line x1="130" y1="206" x2="130" y2="230" stroke="#1f2933" stroke-width="1"/>
  <line x1="242.5" y1="206" x2="242.5" y2="230" stroke="#1f2933" stroke-width="1"/>
  <line x1="132" y1="224" x2="240.5" y2="224" stroke="#1f2933" stroke-width="1" marker-start="url(#tipSmall)" marker-end="url(#tipSmall)"/>
  <text x="186" y="244" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1f2933">2,5 cm</text>

  <!-- eixos -->
  <line x1="430" y1="195" x2="500" y2="195" stroke="#1f2933" stroke-width="1.6" marker-end="url(#tip)"/>
  <line x1="430" y1="195" x2="430" y2="112" stroke="#1f2933" stroke-width="1.6" marker-end="url(#tip)"/>
  <text x="414" y="214" font-family="'Times New Roman', Times, serif" font-size="17" fill="#1f2933">0</text>
  <text x="484" y="216" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" fill="#1f2933">x</text>
  <text x="410" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" fill="#1f2933">y</text>
</svg>
