location = /fsiap-prep {
    return 302 /fsiap-prep/;
}

location ^~ /fsiap-prep/ {
    alias /var/www/fsiap-prep/current/;
    index index.html;
    try_files $uri $uri/ /fsiap-prep/index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
